name: Build and publish Caihong Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: v0.1.0
      publish_release:
        description: Publish the completed build as a GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: caihong-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            alsa-utils android-sdk-libsparse-utils bc bison build-essential \
            ccache curl dwarves e2fsprogs flex git kmod libarchive-tools \
            libelf-dev libssl-dev python3 rsync shellcheck zstd

      - name: Restore package downloads
        uses: actions/cache@v4
        with:
          path: |
            downloads
            build/pacman-cache
          key: archlinuxarm-${{ runner.os }}-${{ hashFiles('dependencies.env', 'scripts/package-archlinuxarm-rootfs.sh') }}
          restore-keys: archlinuxarm-${{ runner.os }}-

      - name: Resolve component branches
        run: scripts/checkout-dependencies.sh

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure compiler cache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Build direct-root kernel and boot image
        run: |
          jobs=$(nproc)
          JOBS=$jobs ZSTD_THREADS=$jobs FORCE=1 \
            KERNEL_CC="ccache gcc" KERNEL_HOSTCC="ccache gcc" \
            scripts/build-kernel-release.sh
          DISTRIBUTION=archlinuxarm scripts/build-caihong-platform-package.sh release
          scripts/build-caihong-kernel-armada-package.sh release
          scripts/build-caihong-npu-package.sh release

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}

      - name: Free kernel build space
        run: rm -rf .ccache linux build/linux

      - name: Build matching Arch Linux ARM rootfs
        run: |
          jobs=$(nproc)
          kernel_release=$(cat release/KERNEL_RELEASE)
          sudo -E env \
            CHROOT_TOOL=chroot \
            KERNEL_PACKAGE="$PWD/release/$(cat release/LINUX_CAIHONG_PACKAGE)" \
            LIBCAMERA_BUILD_JOBS="$jobs" \
            MODULE_TREE="$PWD/modules-current" \
            OUTPUT_FORMAT=ext4 \
            PLASMA_CAMERA_BUILD_JOBS="$jobs" \
            SPARSE_IMAGE=1 \
            USE_PROXY=0 \
            scripts/package-archlinuxarm-rootfs.sh \
            "release/caihong-rootfs-$kernel_release.ext4.sparse.img"
          sudo chown -R "$USER:$USER" release build/pacman-cache downloads

      - name: Prepare release assets
        run: |
          kernel_release=$(cat release/KERNEL_RELEASE)
          scripts/prepare-release-assets.py \
            --release-dir release \
            --rootfs "release/caihong-rootfs-$kernel_release.ext4.sparse.img" \
            --dependencies build/dependencies.resolved.env \
            --assets release/assets \
            --notes release/RELEASE_NOTES.md \
            --require-pacman-kernel

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$INPUT_TAG
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/assets/* --clobber
            declare -A current_assets=()
            for path in release/assets/*; do
              current_assets["${path##*/}"]=1
            done
            while IFS= read -r asset; do
              case "$asset" in
                caihong-boot-*|caihong-rootfs-*|linux-caihong-*|caihong-platform-*|caihong-kernel-armada-*|caihong-npu-*)
                  if [[ -z ${current_assets[$asset]+present} ]]; then
                    gh release delete-asset "$tag" "$asset" --yes
                  fi
                  ;;
              esac
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
            gh release edit "$tag" \
              --title "Caihong Linux $tag" \
              --notes-file release/RELEASE_NOTES.md
          else
            gh release create "$tag" release/assets/* \
              --title "Caihong Linux $tag" \
              --notes-file release/RELEASE_NOTES.md
          fi

      - name: Upload boot artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: caihong-boot-${{ github.run_id }}
          path: |
            release/assets/caihong-boot-linux-*.img
            release/assets/caihong-boot-userdata-*.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload kernel package artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: caihong-kernel-package-${{ github.run_id }}
          path: |
            release/assets/linux-caihong-*-aarch64.pkg.tar.zst
            release/assets/caihong-platform-archlinuxarm-*.tar.zst
            release/assets/caihong-kernel-armada-*.tar.zst
            release/assets/caihong-npu-*-lib.tar.zst

      - name: Upload device component artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: caihong-device-components-${{ github.run_id }}
          path: |
            release/assets/caihong-platform-*
            release/assets/caihong-kernel-armada-*
            release/assets/caihong-npu-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload rootfs artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: caihong-rootfs-${{ github.run_id }}
          path: release/assets/caihong-rootfs-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload release metadata
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: caihong-metadata-${{ github.run_id }}
          path: |
            release/release-manifest.json
            release/RELEASE_NOTES.md
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
