name: Validate release sources

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shellcheck
      - name: Validate scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          sh -n packaging/caihong-kernel-armada/install-caihong-kernel
          sh -n scripts/build-caihong-kernel-armada-package.sh
          sh -n \
            packaging/linux-caihong/install-current-slot \
            packaging/linux-caihong/linux-caihong.install \
            armada.env
          python3 -m compileall -q scripts
          shellcheck -x \
            scripts/build-boot-v2.sh \
            scripts/build-kernel-release.sh \
            scripts/build-linux-caihong-package.sh \
            scripts/build-caihong-npu-package.sh \
            scripts/build-caihong-kernel-armada-package.sh \
            scripts/build-caihong-platform-package.sh \
            scripts/checkout-dependencies.sh \
            scripts/install-caihong-adbd.sh \
            scripts/install-caihong-modules.sh \
            scripts/package-armada-rootfs.sh \
            scripts/verify-armada-rootfs.sh \
            packaging/linux-caihong/install-current-slot \
            packaging/caihong-platform/install-caihong-platform \
            packaging/caihong-kernel-armada/install-caihong-kernel \
            rootfs/archlinuxarm/usr/local/sbin/caihong-bluetooth-autostart \
            rootfs/archlinuxarm/usr/local/sbin/caihong-hardware-mac \
            rootfs/archlinuxarm/usr/local/sbin/caihong-mark-boot-successful \
            rootfs/archlinuxarm/usr/local/sbin/caihong-slot \
            scripts/ssc/install-rootfs.sh
          desktop-file-validate \
            rootfs/archlinuxarm/usr/share/applications/caihong-switch-to-android.desktop
      - name: Reject oversized repository objects
        run: |
          set -euo pipefail
          oversized=$(find . -path ./.git -prune -o -type f -size +95M -print)
          test -z "$oversized" || { printf '%s\n' "$oversized"; exit 1; }
      - name: Verify firmware inputs
        run: |
          (cd firmware && sha256sum -c SHA256SUMS)
          (cd firmware-assets/caihong-ssc && sha256sum -c SHA256SUMS)
