name: Build Caihong kernel update package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caihong-kernel-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel-package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            alsa-utils bc bison build-essential ccache curl dwarves flex git \
            kmod libarchive-tools libelf-dev libssl-dev python3 rsync zstd

      - name: Resolve kernel dependencies
        run: DEPENDENCY_SCOPE=kernel scripts/checkout-dependencies.sh

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure compiler cache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Build kernel update package
        run: |
          jobs=$(nproc)
          JOBS=$jobs ZSTD_THREADS=$jobs FORCE=1 \
            KERNEL_CC="ccache gcc" KERNEL_HOSTCC="ccache gcc" \
            scripts/build-kernel-release.sh
          package=$(cat release/LINUX_CAIHONG_PACKAGE)
          (cd release && sha256sum "$package" > SHA256SUMS.kernel-package)

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}

      - name: Upload kernel update package
        uses: actions/upload-artifact@v4
        with:
          name: linux-caihong-${{ github.run_id }}
          path: |
            release/linux-caihong-*-aarch64.pkg.tar.zst
            release/linux-caihong-*-1.aarch64.rpm
            release/SHA256SUMS.kernel-package
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
