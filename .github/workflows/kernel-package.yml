name: Build Caihong device update packages

on:
  workflow_dispatch:
    inputs:
      include_npu:
        description: Include the Qualcomm NPU runtime package
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: caihong-device-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-update:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            alsa-utils bc bison build-essential ccache curl dwarves file flex git \
            kmod libarchive-tools libelf-dev libssl-dev python3 rpm rsync shellcheck zstd

      - name: Resolve kernel dependencies
        run: DEPENDENCY_SCOPE=kernel scripts/checkout-dependencies.sh

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure compiler cache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Build kernel update packages
        run: |
          jobs=$(nproc)
          JOBS=$jobs ZSTD_THREADS=$jobs FORCE=1 \
            KERNEL_CC="ccache gcc" KERNEL_HOSTCC="ccache gcc" \
            scripts/build-kernel-release.sh
          scripts/build-linux-caihong-rpm.sh modules-current release
          DISTRIBUTION=archlinuxarm scripts/build-caihong-platform-package.sh release
          DISTRIBUTION=armada scripts/build-caihong-platform-package.sh release
          if [[ "${{ inputs.include_npu }}" == true ]]; then
            scripts/build-caihong-npu-package.sh release
            LIBDIR=lib64 scripts/build-caihong-npu-package.sh release
            scripts/verify-caihong-update-packages.sh release
          else
            scripts/verify-caihong-update-packages.sh release --platform-only
          fi
          (
            cd release
            sha256sum \
              linux-caihong-*-aarch64.pkg.tar.zst \
              linux-caihong-*-1.aarch64.rpm \
              caihong-platform-archlinuxarm-*.tar.zst \
              caihong-platform-armada-*.tar.zst \
              > SHA256SUMS.device-update
            if compgen -G 'caihong-npu-*.tar.zst' >/dev/null; then
              sha256sum caihong-npu-*.tar.zst >> SHA256SUMS.device-update
            fi
          )

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dependencies.env', 'linux/arch/arm64/configs/caihong_defconfig') }}-${{ github.run_id }}

      - name: Upload device update packages
        uses: actions/upload-artifact@v4
        with:
          name: caihong-device-update-${{ github.run_id }}
          path: |
            release/linux-caihong-*-aarch64.pkg.tar.zst
            release/linux-caihong-*-1.aarch64.rpm
            release/caihong-platform-archlinuxarm-*.tar.zst
            release/caihong-platform-armada-*.tar.zst
            release/caihong-npu-*.tar.zst
            release/SHA256SUMS.device-update
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
