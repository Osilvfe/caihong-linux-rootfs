<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow send_destination="org.caihong.Keyboard1" send_interface="org.caihong.Keyboard1" send_member="GetStatus"/>
    <deny send_destination="org.caihong.Keyboard1" send_interface="org.caihong.Keyboard1" send_member="SetMediaKeys"/>
    <deny send_destination="org.caihong.Keyboard1" send_interface="org.caihong.Keyboard1" send_member="SetTouchpad"/>
    <allow send_destination="org.caihong.Keyboard1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.caihong.Keyboard1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <policy user="root">
    <allow own="org.caihong.Keyboard1"/>
    <allow send_destination="org.caihong.Keyboard1"/>
  </policy>
</busconfig>
