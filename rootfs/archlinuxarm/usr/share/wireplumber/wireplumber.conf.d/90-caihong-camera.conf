monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device[.]platform-acb6000[.]isp.*" }
      { device.name = "~v4l2_device[.]platform-ac01000[.]remoteproc.*" }
      { device.name = "~v4l2_device[.]platform-aa00000[.]video-codec.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
